# Despliegue: usa la imagen ya construida por el pipeline, no compila código
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tareas}
      POSTGRES_USER: ${POSTGRES_USER:-tareas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tareas}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: gestor-tareas:${IMAGE_TAG:?Indica IMAGE_TAG con la versión a desplegar}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tareas}
      POSTGRES_USER: ${POSTGRES_USER:-tareas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tareas}
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambiar-en-produccion}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos_postgres:
